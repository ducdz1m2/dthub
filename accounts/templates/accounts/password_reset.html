{% extends 'base.html' %}
{% block content %}
<div class="container my-5" style="max-width: 500px;">
    <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
        <div class="card-header bg-success text-white p-4 text-center border-0">
            <i class="bi bi-shield-lock-fill fs-1"></i>
            <h4 class="fw-bold mt-2">Quên mật khẩu?</h4>
            <p class="small mb-0 opacity-75">Nhập email để nhận liên kết thiết lập lại</p>
        </div>
        <div class="card-body p-4 p-md-5">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label fw-bold">Email đăng ký</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="email" class="form-control bg-light border-start-0" 
                               placeholder="email@example.com" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-success w-100 py-3 fw-bold rounded-pill shadow-sm">
                    Gửi liên kết xác nhận
                </button>
            </form>
            <div class="text-center mt-4">
                <a href="{% url 'profile' %}" class="text-decoration-none text-muted small">
                    <i class="bi bi-arrow-left"></i> Quay lại hồ sơ
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
