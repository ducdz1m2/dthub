{% extends 'base.html' %}
{% block content %}
<style>
    .cyber-card {
        background: linear-gradient(135deg, rgba(10, 15, 30, 0.7), rgba(5, 9, 20, 0.9));
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 16px;
    }
    .cyber-input {
        background: rgba(0, 0, 0, 0.5) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        color: #e0eaff !important;
        border-radius: 8px;
        padding: 0.75rem 1rem;
        transition: all 0.3s;
        font-family: 'JetBrains Mono', monospace;
    }
    .cyber-input:focus {
        border-color: var(--neon-blue) !important;
        box-shadow: 0 0 15px rgba(0, 243, 255, 0.2) !important;
    }
    .form-label { color: #a0aec0; font-weight: 600; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; }
</style>

<div class="container my-5 relative z-1" style="max-width: 500px;">
    <div class="cyber-card shadow-lg overflow-hidden">
        <div class="p-4 text-center border-bottom border-secondary" style="border-color: rgba(255,255,255,0.1) !important;">
            <i class="fa-solid fa-shield-lock fs-1 text-warning mb-3" style="filter: drop-shadow(0 0 10px rgba(255, 193, 7, 0.5));"></i>
            <h4 class="fw-bold text-white mb-1">Quên mật khẩu?</h4>
            <p class="small text-secondary font-monospace mb-0">Nhập email để nhận liên kết khôi phục</p>
        </div>
        
        <div class="p-4 p-md-5">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-5">
                    <label class="form-label"><i class="fa-solid fa-envelope text-secondary me-2"></i>Email tài khoản</label>
                    <input type="email" name="email" class="form-control cyber-input" placeholder="nhap.email@example.com" required>
                </div>
                
                <button type="submit" class="btn btn-neon w-100 py-3 fw-bold rounded shadow-sm d-flex justify-content-center align-items-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> GỬI LIÊN KẾT XÁC NHẬN
                </button>
            </form>
            
            <div class="text-center mt-4">
                <a href="{% url 'auth' %}" class="text-secondary text-decoration-none small hover-glow" style="transition: 0.3s;">
                    <i class="fa-solid fa-arrow-left me-1"></i> Quay lại trang Đăng nhập
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
