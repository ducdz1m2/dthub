{% extends 'base.html' %}
{% block content %}
<style>
    .cyber-card {
        background: linear-gradient(135deg, rgba(10, 15, 30, 0.7), rgba(5, 9, 20, 0.9));
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 16px;
    }
</style>

<div class="container my-5 relative z-1" style="max-width: 500px;">
    <div class="cyber-card shadow-lg border-0 text-center p-5">
        <div class="mb-4">
            <i class="fa-solid fa-shield-check text-success" style="font-size: 4.5rem; filter: drop-shadow(0 0 15px rgba(25, 135, 84, 0.5));"></i>
        </div>
        <h3 class="fw-bold text-white mb-3" style="text-shadow: 0 0 8px rgba(255,255,255,0.2);">Khôi phục Thành công!</h3>
        <p class="text-secondary mt-3 font-monospace" style="font-size: 1.05rem;">
            Mã bảo mật của bạn đã được cập nhật mới trên hệ thống DTHub.
        </p>
        <div class="mt-5">
            <a href="{% url 'auth' %}" class="btn btn-neon rounded-pill px-5 py-3 fw-bold shadow w-100">
                <i class="fa-solid fa-right-to-bracket me-2"></i> ĐĂNG NHẬP NGAY
            </a>
        </div>
    </div>
</div>
{% endblock %}
