{% extends 'base.html' %}
{% block content %}
<div class="container my-5" style="max-width: 500px;">
    <div class="card shadow border-0 rounded-4 text-center p-5">
        <div class="mb-3">
            <i class="bi bi-check2-circle text-success" style="font-size: 4rem;"></i>
        </div>
        <h3 class="fw-bold">Kiểm tra Email</h3>
        <p class="text-muted mt-3">
            Chúng tôi đã gửi hướng dẫn đặt lại mật khẩu vào địa chỉ email của bạn.
        </p>
        <p class="small text-secondary">
            Nếu không thấy trong hộp thư đến, hãy kiểm tra thư mục <strong>Spam</strong>.
        </p>
        <div class="mt-4">
            <a href="{% url 'auth' %}" class="btn btn-outline-success rounded-pill px-4">Quay về Đăng nhập</a>
        </div>
    </div>
</div>
{% endblock %}
