{% extends 'base.html' %}
{% block content %}
<style>
    .cyber-card {
        background: linear-gradient(135deg, rgba(10, 15, 30, 0.7), rgba(5, 9, 20, 0.9));
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 16px;
    }
</style>

<div class="container my-5 relative z-1" style="max-width: 500px;">
    <div class="cyber-card shadow-lg text-center p-5">
        <div class="mb-4">
            <i class="fa-solid fa-envelope-circle-check text-info" style="font-size: 4.5rem; filter: drop-shadow(0 0 15px rgba(0, 243, 255, 0.4));"></i>
        </div>
        <h3 class="fw-bold text-white mb-3" style="text-shadow: 0 0 8px rgba(255,255,255,0.2);">Kiểm tra Email</h3>
        <p class="text-secondary mb-2" style="font-size: 1.05rem;">
            Hệ thống đã gửi hướng dẫn đặt lại mật khẩu vào địa chỉ email của bạn.
        </p>
        <p class="small text-secondary font-monospace opacity-75 mt-3 border-top border-secondary pt-3" style="border-color: rgba(255,255,255,0.1) !important;">
            > Chú ý: Nếu không thấy trong Hộp thư đến, vui lòng kiểm tra thư mục <strong>Spam / Thư rác</strong>.
        </p>
        
        <div class="mt-5">
            <a href="{% url 'auth' %}" class="btn text-light rounded-pill px-5 py-2" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); transition: 0.3s;">
                <i class="fa-solid fa-arrow-left me-2"></i> Trở về Đăng nhập
            </a>
        </div>
    </div>
</div>
{% endblock %}
