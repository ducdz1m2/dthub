{% extends 'base.html' %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0">
                <div class="card-body p-4">
                    <h4 class="fw-bold mb-3 text-success">Xác nhận địa chỉ lắp đặt</h4>
                    <p class="text-muted">Sản phẩm: <strong>{{ product.name }}</strong></p>
                    
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">Địa chỉ nhận hàng/Lắp đặt</label>
                            {{ form.address }} <small class="text-muted">Vui lòng nhập địa chỉ chính xác để nhân viên liên hệ.</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Ghi chú (nếu có)</label>
                            {{ form.note }}
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-2">XÁC NHẬN ĐẶT ĐƠN</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
